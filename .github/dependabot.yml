version: 2
updates:
- package-ecosystem: docker
  directory: "/.devcontainer"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
- package-ecosystem: "devcontainers"
  directory: "/"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
  ignore:
  # ruff bumps go through the dodona-tested image (docker-images) first, then this pin
  - dependency-name: "ruff"
