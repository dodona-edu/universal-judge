# Prototype workflow: builds the Nix images and runs the Bash/Python test
# selection inside tested-all. Added alongside the existing Docker CI, which is
# unchanged. Does not push any image.
name: Nix prototype

on:
  push:
    branches:
      - "**"
    paths:
      - "deps/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "pyproject.toml"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Build and load tested-all
        run: |
          nix build .#images.tested-all --print-build-logs
          ./result | docker load

      - name: Run the full test suite inside tested-all
        run: |
          docker run --rm --user runner \
            -v "$GITHUB_WORKSPACE":/home/runner/workdir -w /home/runner/workdir \
            tested-all:nix \
            pytest -n 4 tests/

      - name: Lint checks inside the dev shell
        run: |
          nix develop -c black --check tested tests
          nix develop -c isort --check-only tested tests
          nix develop -c pyright tested tests
