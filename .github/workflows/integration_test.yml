name: Integration test

on:
  push:

permissions:
  contents: read

jobs:
  integration-test:
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}

  integration-lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dodona-edu/dodona-tested:latest
      options: --user root

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dev dependencies
        run: ./devel/install_dev_deps.sh
      - name: Run the linters
        run: ./devel/check.sh

  # codecov-action needs curl and gpg. They happen to be in this image, but we'd
  # rather not depend on the environment the test is meant to exercise shipping them.
  coverage:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
      - name: Code Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
