name: Dockerfile

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dockerfile-matches-image:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dodona-edu/dodona-tested:latest
      options: --user root

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the dockerfile against the image it built
        run: ./devel/dockerfile_delta.sh
