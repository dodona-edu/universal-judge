[image]
name = "dodona-tested-python"
languages = ["python"]
includes = ["core", "userland"]

[tools]
# python itself comes from [python] below; the judge needs no extra PATH tools.

[python]
interpreter = { version = "3.12", nixpkgs = "python312" }

[python.packages]
# Exercise libraries for the single Python environment of this image.
# The judge packages (incl. the pinned pylint) come from pyproject.toml.
numpy = "2.5"
pandas = "3.0"
openpyxl = "3.1"
matplotlib = "3.11"
lxml = "6.1"

