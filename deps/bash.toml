[image]
name = "dodona-tested-bash"
languages = ["bash"]
includes = ["core", "userland"]

[tools]
shellcheck = "0.11"
ncurses = "6"          # clear, tput, reset, infocmp, tset (in the old image)
bc = "1"
binutils = "2"
cowsay = "3"
ed = "1"
figlet = "2"
toilet = "0.3"
tree = "2"
vim = "9"
xxd = { version = "1", nixpkgs = "xxd" }
