[[PLR0133.messages]]
original = "Two constants compared in a comparison, consider replacing `{left_constant} {op} {right_constant}`"
en = "You compare two fixed values, so the result is always the same. Replace `{left_constant} {op} {right_constant}` with its result."
nl = "Je vergelijkt twee vaste waarden, dus de uitkomst is altijd dezelfde. Vervang `{left_constant} {op} {right_constant}` door het resultaat."

