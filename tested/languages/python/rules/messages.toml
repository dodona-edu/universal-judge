en = "This `else` on a loop is useless because the loop has no `break`: its code always runs. Remove the `else` and indent its code one level less."
nl = "Deze `else` bij een lus is nutteloos omdat de lus geen `break` heeft: de code erin wordt altijd uitgevoerd. Verwijder de `else` en laat de code een niveau minder inspringen."

[PLW0127]  # self-assigning-variable
