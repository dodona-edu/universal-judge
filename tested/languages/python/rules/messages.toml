en = "Merge these `isinstance` calls for `{name}` into one, with a tuple of types, like `isinstance({name}, (int, float))`."
nl = "Voeg deze `isinstance`-oproepen voor `{name}` samen tot één, met een tuple van types, zoals `isinstance({name}, (int, float))`."

