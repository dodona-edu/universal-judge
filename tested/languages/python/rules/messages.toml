[[F632.messages]]
original = "Use `==` to compare constant literals"
en = "Use `==` to compare with a fixed value such as a number or string: `is` checks whether two things are the very same object."
nl = "Gebruik `==` om te vergelijken met een vaste waarde zoals een getal of string: `is` controleert of twee dingen exact hetzelfde object zijn."

[[F632.messages]]
original = "Use `!=` to compare constant literals"
en = "Use `!=` to compare with a fixed value such as a number or string: `is not` checks whether two things are different objects."
nl = "Gebruik `!=` om te vergelijken met een vaste waarde zoals een getal of string: `is not` controleert of twee dingen verschillende objecten zijn."

