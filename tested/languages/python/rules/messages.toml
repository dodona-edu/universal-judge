en = "The key `{name}` appears more than once in this dictionary. Only the last value is kept."
nl = "De sleutel `{name}` komt meer dan één keer voor in deze dictionary. Enkel de laatste waarde blijft over."

[[F602.messages]]
original = "Dictionary key repeated"
en = "A key appears more than once in this dictionary. Only the last value is kept."
nl = "Een sleutel komt meer dan één keer voor in deze dictionary. Enkel de laatste waarde blijft over."

