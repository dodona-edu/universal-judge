[S307]  # suspicious-eval-usage
type = "warning"

[[S307.messages]]
original = "Use of possibly insecure function; consider using `ast.literal_eval`"
en = "`eval` runs any code it is given, which is risky. To turn text into a number, use `int()` or `float()`; for a list or other value, use `ast.literal_eval`."
nl = "`eval` voert eender welke code uit die je meegeeft, en dat is riskant. Gebruik `int()` of `float()` om tekst om te zetten naar een getal, of `ast.literal_eval` voor een lijst of een andere waarde."

[SIM101]  # duplicate-isinstance-call
