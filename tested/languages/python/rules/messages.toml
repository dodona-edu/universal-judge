# The texts of lint remarks. Shared with TESTed's Python linter: keep this file and
# ruff.toml (which rules run) the same in both judges.
#
# One table per rule: `type` is the annotation type Dodona shows (error, warning
# or info). Each [[CODE.messages]] entry holds an English message template the
# linter writes (`original`, with placeholders such as `{name}`, or `{}` by
# position) and the text per language. A message is matched against the
# templates of its rule in this order, so a more specific template goes first;
# the values of its placeholders are filled in the text of the student's
# language. A language without a text falls back to `en`, a message without a
# matching template to the linter's own message. A translation may leave out a
# placeholder, but not add one.
#
# `syntax-error` is not a ruff rule: it is Python's own message for a submission
# that doesn't compile.

[ARG001]  # unused-function-argument
type = "warning"

[[ARG001.messages]]
original = "Unused function argument: `{name}`"
en = "The parameter `{name}` is never used in this function. Use it, or remove it if you don't need it."
nl = "De parameter `{name}` wordt nergens gebruikt in deze functie. Gebruik hem, of verwijder hem als je hem niet nodig hebt."

[ARG002]  # unused-method-argument
type = "warning"

[[ARG002.messages]]
original = "Unused method argument: `{name}`"
en = "The parameter `{name}` is never used in this method. Use it, or remove it if you don't need it."
nl = "De parameter `{name}` wordt nergens gebruikt in deze methode. Gebruik hem, of verwijder hem als je hem niet nodig hebt."

[B006]  # mutable-argument-default
type = "warning"

[[B006.messages]]
original = "Do not use mutable data structures for argument defaults"
en = "Don't use a list, dictionary or set as the default value of a parameter: all calls of the function share that same object. Use `None` as the default and create a new one inside the function."
nl = "Gebruik geen lijst, dictionary of verzameling als standaardwaarde van een parameter: alle oproepen van de functie delen dan hetzelfde object. Gebruik `None` als standaardwaarde en maak binnen de functie een nieuw object aan."

[B012]  # jump-statement-in-finally
type = "warning"

[[B012.messages]]
original = "`{name}` inside `finally` blocks cause exceptions to be silenced"
en = "A `{name}` in a `finally` block silently cancels any exception that was raised. Move it out of the `finally` block."
nl = "Een `{name}` in een `finally`-blok laat elke opgegooide exception ongemerkt verdwijnen. Zet die opdracht buiten het `finally`-blok."

[B018]  # useless-expression
type = "warning"

[[B018.messages]]
original = "Found useless expression. Either assign it to a variable or remove it."
en = "This expression has no effect, because its result is not used. Store it in a variable or remove it. To call a function or method, add parentheses, like `print()` or `numbers.sort()`."
nl = "Deze uitdrukking heeft geen effect, want het resultaat wordt niet gebruikt. Bewaar het in een variabele of verwijder de uitdrukking. Wil je een functie of methode oproepen, zet er dan haakjes achter, zoals `print()` of `getallen.sort()`."

[[B018.messages]]
original = "Found useless attribute access. Either assign it to a variable or remove it."
en = "This attribute access has no effect. To call a method, add parentheses, like `numbers.sort()`. Otherwise store the value in a variable or remove it."
nl = "Het opvragen van dit attribuut heeft geen effect. Wil je een methode oproepen, zet er dan haakjes achter, zoals `getallen.sort()`. Bewaar anders de waarde in een variabele of verwijder het."

[B023]  # function-uses-loop-variable
type = "warning"

[[B023.messages]]
original = "Function definition does not bind loop variable `{name}`"
en = "This function uses the loop variable `{name}`, but only looks up its value when it is called. If that happens after the loop, it gets the value from the last round. Bind the current value with a default value, like `{name}={name}` among the parameters."
nl = "Deze functie gebruikt de lusvariabele `{name}`, maar zoekt de waarde pas op wanneer ze opgeroepen wordt. Gebeurt dat na de lus, dan krijgt ze de waarde uit de laatste ronde. Leg de huidige waarde vast met een standaardwaarde, zoals `{name}={name}` bij de parameters."

[B033]  # duplicate-value
type = "warning"

[[B033.messages]]
original = "Sets should not contain duplicate item `{value}`"
en = "The item `{value}` appears more than once in this set. Remove the duplicate."
nl = "Het element `{value}` komt meer dan één keer voor in deze verzameling. Verwijder het dubbele element."

[[B033.messages]]
original = "Sets should not contain duplicate items, but `{existing}` and `{value}` has the same value"
en = "This set contains the same value twice: `{existing}` and `{value}` are equal. Remove one of them."
nl = "Deze verzameling bevat twee keer dezelfde waarde: `{existing}` en `{value}` zijn gelijk. Verwijder er één."

[B904]  # raise-without-from-inside-except
type = "info"

[[B904.messages]]
original = "Within an `except*` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling"
en = "When you raise a new exception in an `except*` block, link it to the caught one: write `except* ... as err:` and `raise ... from err`, or use `raise ... from None` to leave the caught one out. Then the error message shows clearly where the problem started."
nl = "Als je in een `except*`-blok een nieuwe exception opgooit, koppel ze dan aan de opgevangen exception: schrijf `except* ... as err:` en `raise ... from err`, of gebruik `raise ... from None` om die weg te laten. Dan toont de foutmelding duidelijk waar het probleem begon."

[[B904.messages]]
original = "Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling"
en = "When you raise a new exception in an `except` block, link it to the caught one: write `except ... as err:` and `raise ... from err`, or use `raise ... from None` to leave the caught one out. Then the error message shows clearly where the problem started."
nl = "Als je in een `except`-blok een nieuwe exception opgooit, koppel ze dan aan de opgevangen exception: schrijf `except ... as err:` en `raise ... from err`, of gebruik `raise ... from None` om die weg te laten. Dan toont de foutmelding duidelijk waar het probleem begon."

[C403]  # unnecessary-list-comprehension-set
type = "info"

[[C403.messages]]
original = "Unnecessary list comprehension (rewrite as a set comprehension)"
en = "No need to build a list first. Write a set comprehension directly, with curly brackets, instead of `set([...])`."
nl = "Je hoeft niet eerst een lijst te maken. Schrijf meteen een set comprehension met accolades, in plaats van `set([...])`."

[C408]  # unnecessary-collection-call
type = "info"

[[C408.messages]]
original = "Unnecessary `list()` call (rewrite as a literal)"
en = "No need to call `list()`. Write `[]` for an empty list."
nl = "Je hoeft `list()` niet op te roepen. Schrijf `[]` voor een lege lijst."

[[C408.messages]]
original = "Unnecessary `dict()` call (rewrite as a literal)"
en = "No need to call `dict()`. Write the dictionary directly with curly brackets, like `{\"a\": 1}` instead of `dict(a=1)`."
nl = "Je hoeft `dict()` niet op te roepen. Schrijf de dictionary rechtstreeks met accolades, zoals `{\"a\": 1}` in plaats van `dict(a=1)`."

[[C408.messages]]
original = "Unnecessary `tuple()` call (rewrite as a literal)"
en = "No need to call `tuple()`. Write `()` for an empty tuple."
nl = "Je hoeft `tuple()` niet op te roepen. Schrijf `()` voor een lege tuple."

[[C408.messages]]
original = "Unnecessary `{kind}()` call (rewrite as a literal)"
en = "No need to call `{kind}()`. Write the value directly with brackets."
nl = "Je hoeft `{kind}()` niet op te roepen. Schrijf de waarde rechtstreeks met haakjes."

[C416]  # unnecessary-comprehension
type = "info"

[[C416.messages]]
original = "Unnecessary {kind} comprehension (rewrite using `{kind}()`)"
en = "This {kind} comprehension copies the elements without changing them. Use `{kind}()` instead."
nl = "Deze {kind} comprehension neemt de elementen ongewijzigd over. Gebruik gewoon `{kind}()`."

[C419]  # unnecessary-comprehension-in-call
type = "info"

[[C419.messages]]
original = "Unnecessary list comprehension"
en = "No need to build a list here. Leave out the square brackets, so the values are produced one by one (a generator expression)."
nl = "Je hoeft hier geen lijst te maken. Laat de rechte haken weg, zodat de waarden één voor één aangemaakt worden (een generator expression)."

[[C419.messages]]
original = "Unnecessary set comprehension"
en = "No need to build a set here. Leave out the curly brackets, so the values are produced one by one (a generator expression)."
nl = "Je hoeft hier geen verzameling te maken. Laat de accolades weg, zodat de waarden één voor één aangemaakt worden (een generator expression)."

[E401]  # multiple-imports-on-one-line
type = "info"

[[E401.messages]]
original = "Multiple imports on one line"
en = "Put each import on its own line."
nl = "Zet elke import op een aparte regel."

[E402]  # module-import-not-at-top-of-file
type = "info"

[[E402.messages]]
original = "Module level import not at top of cell"
en = "Put your imports at the top of the cell."
nl = "Zet je imports bovenaan de cel."

[[E402.messages]]
original = "Module level import not at top of file"
en = "Put your imports at the top of the file."
nl = "Zet je imports bovenaan het bestand."

[E701]  # multiple-statements-on-one-line-colon
type = "info"

[[E701.messages]]
original = "Multiple statements on one line (colon)"
en = "Put the code after the colon on a new, indented line."
nl = "Zet de code na de dubbelepunt op een nieuwe regel en laat die inspringen."

[E702]  # multiple-statements-on-one-line-semicolon
type = "info"

[[E702.messages]]
original = "Multiple statements on one line (semicolon)"
en = "Put each statement on its own line instead of separating them with a semicolon."
nl = "Zet elke opdracht op een aparte regel in plaats van ze te scheiden met een puntkomma."

[E703]  # useless-semicolon
type = "info"

[[E703.messages]]
original = "Statement ends with an unnecessary semicolon"
en = "Remove the semicolon at the end of this line; Python doesn't need it."
nl = "Verwijder de puntkomma op het einde van deze regel; Python heeft die niet nodig."

[E711]  # none-comparison
type = "info"

[[E711.messages]]
original = "Comparison to `None` should be `cond is None`"
en = "Compare with `None` using `is None`, not `==`."
nl = "Gebruik `is None` om met `None` te vergelijken, niet `==`."

[[E711.messages]]
original = "Comparison to `None` should be `cond is not None`"
en = "Compare with `None` using `is not None`, not `!=`."
nl = "Gebruik `is not None` om met `None` te vergelijken, niet `!=`."

[E712]  # true-false-comparison
type = "info"

[[E712.messages]]
original = "Avoid equality comparisons to `True`; use `{cond}:` for truth checks"
en = "No need to compare with `True`. Write just `{cond}` instead of the comparison."
nl = "Je hoeft niet te vergelijken met `True`. Schrijf gewoon `{cond}` in plaats van de vergelijking."

[[E712.messages]]
original = "Avoid inequality comparisons to `True`; use `not {cond}:` for false checks"
en = "No need to compare with `True`. Write `not {cond}` instead of the comparison."
nl = "Je hoeft niet te vergelijken met `True`. Schrijf `not {cond}` in plaats van de vergelijking."

[[E712.messages]]
original = "Avoid equality comparisons to `False`; use `not {cond}:` for false checks"
en = "No need to compare with `False`. Write `not {cond}` instead of the comparison."
nl = "Je hoeft niet te vergelijken met `False`. Schrijf `not {cond}` in plaats van de vergelijking."

[[E712.messages]]
original = "Avoid inequality comparisons to `False`; use `{cond}:` for truth checks"
en = "No need to compare with `False`. Write just `{cond}` instead of the comparison."
nl = "Je hoeft niet te vergelijken met `False`. Schrijf gewoon `{cond}` in plaats van de vergelijking."

[E713]  # not-in-test
type = "info"

[[E713.messages]]
original = "Test for membership should be `not in`"
en = "Write `x not in y` instead of `not x in y`."
nl = "Schrijf `x not in y` in plaats van `not x in y`."

[E721]  # type-comparison
type = "info"

[[E721.messages]]
original = "Use `is` and `is not` for type comparisons, or `isinstance()` for isinstance checks"
en = "To check the type of a value, use `isinstance()`, or compare types with `is` instead of `==`."
nl = "Gebruik `isinstance()` om het type van een waarde te controleren, of vergelijk types met `is` in plaats van `==`."

[E722]  # bare-except
type = "warning"

[[E722.messages]]
original = "Do not use bare `except`"
en = "An `except:` without an exception type also catches errors you don't expect. Say which exception you want to catch, for example `except ValueError:`."
nl = "Een `except:` zonder exception erachter vangt ook fouten op die je niet verwacht. Vermeld welke exception je wil opvangen, bijvoorbeeld `except ValueError:`."

[E731]  # lambda-assignment
type = "info"

[[E731.messages]]
original = "Do not assign a `lambda` expression, use a `def`"
en = "Don't store a `lambda` in a variable. Define a function with `def` instead."
nl = "Bewaar geen `lambda` in een variabele. Definieer een functie met `def`."

[F401]  # unused-import
type = "warning"

[[F401.messages]]
original = "`{name}` imported but unused; consider using `importlib.util.find_spec` to test for availability"
en = "`{name}` is imported but never used. If you only want to check whether it is available, use `importlib.util.find_spec`; otherwise remove the import."
nl = "`{name}` wordt geïmporteerd maar nergens gebruikt. Wil je enkel nagaan of het beschikbaar is, gebruik dan `importlib.util.find_spec`; verwijder anders de import."

[[F401.messages]]
original = "`{name}` imported but unused; consider removing, adding to `__all__`, or using a redundant alias"
en = "`{name}` is imported but never used. Remove the import."
nl = "`{name}` wordt geïmporteerd maar nergens gebruikt. Verwijder de import."

[[F401.messages]]
original = "`{name}` imported but unused"
en = "`{name}` is imported but never used. Remove the import."
nl = "`{name}` wordt geïmporteerd maar nergens gebruikt. Verwijder de import."

[F402]  # import-shadowed-by-loop-var
type = "warning"

[[F402.messages]]
original = "Import `{name}` from line {line} shadowed by loop variable"
en = "The loop variable overwrites `{name}`, which you imported on line {line}. Use another name for the loop variable."
nl = "De lusvariabele overschrijft de import `{name}` van regel {line}. Kies een andere naam voor de lusvariabele."

[[F402.messages]]
original = "Import `{name}` from {row} shadowed by loop variable"
en = "The loop variable overwrites `{name}`, which you imported on {row}. Use another name for the loop variable."
nl = "De lusvariabele overschrijft de import `{name}` van {row}. Kies een andere naam voor de lusvariabele."

[F403]  # undefined-local-with-import-star
type = "warning"

[[F403.messages]]
original = "`from {name} import *` used; unable to detect undefined names"
en = "Avoid `from {name} import *`: it hides which names you import, so mistakes in names can't be detected. Import only the names you need, like `from {name} import ...`."
nl = "Vermijd `from {name} import *`: zo zie je niet welke namen je importeert, en fouten in namen worden niet opgemerkt. Importeer enkel de namen die je nodig hebt, zoals `from {name} import ...`."

[F404]  # late-future-import
type = "error"

[[F404.messages]]
original = "`from __future__` imports must occur at the beginning of the file"
en = "`from __future__` imports must be the first statements of the file."
nl = "`from __future__`-imports moeten de eerste opdrachten van het bestand zijn."

[F405]  # undefined-local-with-import-star-usage
type = "warning"

[[F405.messages]]
original = "`{name}` may be undefined, or defined from star imports"
en = "`{name}` may not be defined, or it comes from an `import *`. Import it by name, like `from ... import {name}`, or define it."
nl = "`{name}` is misschien niet gedefinieerd, of komt uit een `import *`. Importeer het met naam, zoals `from ... import {name}`, of definieer het."

[F406]  # undefined-local-with-nested-import-star-usage
type = "error"

[[F406.messages]]
original = "`from {name} import *` only allowed at module level"
en = "`from {name} import *` is only allowed outside functions and classes."
nl = "`from {name} import *` mag enkel buiten functies en klassen staan."

[F407]  # future-feature-not-defined
type = "error"

[[F407.messages]]
original = "Future feature `{name}` is not defined"
en = "`{name}` doesn't exist in `__future__`. Check the spelling."
nl = "`{name}` bestaat niet in `__future__`. Controleer de spelling."

[F501]  # percent-format-invalid-format
type = "error"

[[F501.messages]]
original = "`%`-format string has invalid format string: {message}"
en = "This string with `%` formatting is invalid: {message}"
nl = "Deze string met `%`-opmaak is ongeldig: {message}"

[F502]  # percent-format-expected-mapping
type = "error"

[[F502.messages]]
original = "`%`-format string expected mapping but got sequence"
en = "This string uses placeholders with a name, like `%(name)s`, so the values after `%` must be in a dictionary, not in a tuple."
nl = "Deze string gebruikt plaatshouders met een naam, zoals `%(naam)s`, dus de waarden na `%` moeten in een dictionary staan en niet in een tuple."

[F503]  # percent-format-expected-sequence
type = "error"

[[F503.messages]]
original = "`%`-format string expected sequence but got mapping"
en = "This string uses placeholders without a name, like `%s`, so the values after `%` must be in a tuple, not in a dictionary."
nl = "Deze string gebruikt plaatshouders zonder naam, zoals `%s`, dus de waarden na `%` moeten in een tuple staan en niet in een dictionary."

[F504]  # percent-format-extra-named-arguments
type = "warning"

[[F504.messages]]
original = "`%`-format string has unused named argument(s): {message}"
en = "The dictionary after `%` contains names that the string never uses: `{message}`"
nl = "De dictionary na `%` bevat namen die de string nergens gebruikt: `{message}`"

[F505]  # percent-format-missing-argument
type = "error"

[[F505.messages]]
original = "`%`-format string is missing argument(s) for placeholder(s): {message}"
en = "The dictionary after `%` has no value for these placeholders: `{message}`"
nl = "De dictionary na `%` heeft geen waarde voor deze plaatshouders: `{message}`"

[F506]  # percent-format-mixed-positional-and-named
type = "error"

[[F506.messages]]
original = "`%`-format string has mixed positional and named placeholders"
en = "Don't mix placeholders with and without a name, like `%s` and `%(name)s`, in the same string. Choose one style."
nl = "Gebruik in dezelfde string niet zowel plaatshouders met als zonder naam, zoals `%s` en `%(naam)s`. Kies één stijl."

[F507]  # percent-format-positional-count-mismatch
type = "error"

[[F507.messages]]
original = "`%`-format string has {wanted} placeholder(s) but {got} substitution(s)"
en = "This string has {wanted} placeholder(s), but you give {got} value(s) after `%`. These numbers must be equal."
nl = "Deze string heeft {wanted} plaatshouder(s), maar je geeft {got} waarde(n) mee na `%`. Die aantallen moeten gelijk zijn."

[F508]  # percent-format-star-requires-sequence
type = "error"

[[F508.messages]]
original = "`%`-format string `*` specifier requires sequence"
en = "A `*` in a `%` placeholder needs the values in a tuple."
nl = "Een `*` in een `%`-plaatshouder vraagt om de waarden in een tuple."

[F509]  # percent-format-unsupported-format-character
type = "error"

[[F509.messages]]
original = "`%`-format string has unsupported format character `{char}`"
en = "`{char}` is not a valid format character after a `%`. Use for example `%s`, `%d` or `%f`."
nl = "`{char}` is geen geldig opmaakteken na een `%`. Gebruik bijvoorbeeld `%s`, `%d` of `%f`."

[F521]  # string-dot-format-invalid-format
type = "error"

[[F521.messages]]
original = "`.format` call has invalid format string: {message}"
en = "The string used with `.format` is invalid: {message}"
nl = "De string bij `.format` is ongeldig: {message}"

[F522]  # string-dot-format-extra-named-arguments
type = "warning"

[[F522.messages]]
original = "`.format` call has unused named argument(s): {message}"
en = "`.format` gets named values that the string never uses: `{message}`"
nl = "`.format` krijgt waarden met een naam mee die de string nergens gebruikt: `{message}`"

[F523]  # string-dot-format-extra-positional-arguments
type = "warning"

[[F523.messages]]
original = "`.format` call has unused arguments at position(s): {message}"
en = "`.format` gets values that the string never uses, at position(s) (counting from 0): {message}"
nl = "`.format` krijgt waarden mee die de string nergens gebruikt, op positie(s) (vanaf 0 geteld): {message}"

[F524]  # string-dot-format-missing-arguments
type = "error"

[[F524.messages]]
original = "`.format` call is missing argument(s) for placeholder(s): {message}"
en = "The string used with `.format` has placeholders without a value: `{message}`"
nl = "De string bij `.format` heeft plaatshouders zonder waarde: `{message}`"

[F525]  # string-dot-format-mixing-automatic
type = "error"

[[F525.messages]]
original = "`.format` string mixes automatic and manual numbering"
en = "Don't mix empty placeholders and numbered ones in the same string for `.format`. Number all of them, or none."
nl = "Gebruik in dezelfde string voor `.format` niet zowel lege als genummerde plaatshouders. Nummer ze allemaal, of geen enkele."

[F541]  # f-string-missing-placeholders
type = "warning"

[[F541.messages]]
original = "f-string without any placeholders"
en = "This f-string has nothing between curly brackets, so the `f` is not needed. Remove the `f`, or add the value you wanted to fill in."
nl = "Deze f-string bevat niets tussen accolades, dus de `f` is overbodig. Verwijder de `f`, of voeg de waarde toe die je wou invullen."

