- tab: "Tuples"
  contexts:
    - testcases:
        - expression: 'count_pairs({(1, 2), (2, 3)})'
          return: 2
    - testcases:
        - expression: 'sum_firsts([(1, 2), (3, 4)])'
          return: 4
