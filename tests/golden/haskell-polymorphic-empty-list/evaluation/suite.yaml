- tab: "rev"
  testcases:
    - expression: "rev([1, 2])"
      return: [2, 1]
    - expression: "rev([])"
      return: []
- tab: "flatten"
  testcases:
    - expression: "flatten([[1], [2, 3]])"
      return: [1, 2, 3]
    - expression: "flatten([[]])"
      return: []
- tab: "firstOr"
  testcases:
    - expression: "firstOr([\"a\", \"b\"])"
      return: "a"
    - expression: "firstOr([[]])"
      return: []
- tab: "actions"
