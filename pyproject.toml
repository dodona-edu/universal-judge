[project]
name = "tested"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9,<8",
    "attrs>=23.2,<27",
    "cattrs>=23.2,<27",
    "jsonschema>=4.22,<5",
    "typing_inspect>=0.9,<1",
    "pyyaml>=6.0,<7",
    "Pygments>=2.18,<3",
    "python-i18n>=0.3.9,<0.4",
    "pylint>=3.0.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "pytest-mock>=3.14,<4",
    "pytest-cov>=5.0,<8",
    "pytest-xdist>=3.6,<4",
    "syrupy>=4.6,<6",
    "black>=24.4,<25",
    "isort>=5.13,<6",
    "jinja2>=3.1,<4",
    "marko>=2.0,<3",
]

[tool.isort]
profile = "black"
skip_glob = ["tests/exercises/*"]

[tool.pylint.format]
max-line-length = "88"

[tool.black]
line-length = 88
extend-exclude="tests/exercises/*"

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_integration_javascript.py"
markers = ["haskell"]

[tool.pyright]
exclude = ["tests/exercises/", "tests/snapshots/", "tests/descriptions/"]

[tool.poetry]
name = "tested"
version = "1.0.0"
description = ""
authors = ["Niko Strijbol <strijbol.niko@gmail.com>"]
license = "MIT"
readme = "README.md"
