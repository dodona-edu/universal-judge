[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/exercises/", "tests/golden/", "tests/descriptions/"]

[tool.ruff.lint]
# Rules with findings still to fix: drop one once its findings are fixed
ignore = [
    "F401",
    "F541",
    "FURB105",
    "FURB167",
    "PIE790",
    "RUF023",
    "UP006",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# These tests check that typing.Union is handled like X | Y
"tests/test_parsing.py" = ["UP007"]

[tool.pytest]
strict = true
testpaths = ["tests"]
markers = [
    "bash",
    "c",
    "cpp",
    "csharp",
    "haskell",
    "java",
    "javascript",
    "kotlin",
    "python",
    "typescript",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/exercises/", "tests/golden/"]

[tool.ty.rules]
unused-type-ignore-comment = "error"

# ty findings still to fix: drop a rule (or block) once its file passes it
[[tool.ty.overrides]]
include = ["tested/dsl/ast_translator.py"]
rules = { deprecated = "ignore", invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/dsl/translate_parser.py"]
rules = { invalid-argument-type = "ignore", missing-argument = "ignore" }

[[tool.ty.overrides]]
include = ["tested/parsing.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_parsing.py"]
rules = { invalid-argument-type = "ignore" }

[tool.poetry]
name = "tested"
version = "1.0.0"
description = ""
authors = ["Niko Strijbol <strijbol.niko@gmail.com>"]
license = "MIT"
readme = "README.md"
