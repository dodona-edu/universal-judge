[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/exercises/", "tests/golden/", "tests/descriptions/"]

[tool.ruff.lint.per-file-ignores]
# These tests check that typing.Union is handled like X | Y
"tests/test_parsing.py" = ["UP007"]

[tool.pytest]
strict = true
testpaths = ["tests"]
markers = [
    "bash",
    "c",
    "cpp",
    "csharp",
    "haskell",
    "java",
    "javascript",
    "kotlin",
    "python",
    "typescript",
]

[tool.pyright]
exclude = ["tests/exercises/", "tests/golden/", "tests/snapshots/", "tests/descriptions/"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/exercises/", "tests/golden/"]

[tool.ty.rules]
# pyright still needs these `# type: ignore` comments
unused-type-ignore-comment = "ignore"

# ty findings still to fix: drop a rule (or block) once its file passes it
[[tool.ty.overrides]]
include = ["tested/dsl/ast_translator.py"]
rules = { deprecated = "ignore", invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/dsl/translate_parser.py"]
rules = { invalid-argument-type = "ignore", missing-argument = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/bash/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/c/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/cpp/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/csharp/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/haskell/config.py"]
rules = { invalid-argument-type = "ignore", invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/java/config.py"]
rules = { invalid-argument-type = "ignore", invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/javascript/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/kotlin/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/python/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/typescript/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/parsing.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/serialisation.py"]
rules = { no-matching-overload = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_compilation.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_language_quirks.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_oracles_builtin.py"]
rules = { possibly-missing-submodule = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_parsing.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_serialisation.py"]
rules = { invalid-argument-type = "ignore" }

[tool.poetry]
name = "tested"
version = "1.0.0"
description = ""
authors = ["Niko Strijbol <strijbol.niko@gmail.com>"]
license = "MIT"
readme = "README.md"
