[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/exercises/", "tests/golden/", "tests/descriptions/"]

[tool.ruff.lint]
# Rules with findings still to fix: drop one once its findings are fixed
ignore = [
    "B017",
    "BLE001",
    "C400",
    "C401",
    "C408",
    "C417",
    "F401",
    "F541",
    "F841",
    "FURB105",
    "FURB167",
    "PERF402",
    "PIE790",
    "PIE810",
    "PYI025",
    "PYI061",
    "RUF009",
    "RUF023",
    "S102",
    "S110",
    "SIM101",
    "SIM102",
    "SIM103",
    "SIM114",
    "SIM115",
    "SIM118",
    "SIM201",
    "SIM210",
    "TRY002",
    "TRY004",
    "TRY201",
    "TRY401",
    "UP006",
    "UP007",
    "UP035",
    "UP040",
    "UP045",
    "UP047",
]

[tool.pytest]
strict = true
testpaths = ["tests"]
markers = [
    "bash",
    "c",
    "cpp",
    "csharp",
    "haskell",
    "java",
    "javascript",
    "kotlin",
    "python",
    "typescript",
]

[tool.pyright]
exclude = ["tests/exercises/", "tests/golden/", "tests/snapshots/", "tests/descriptions/"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/exercises/", "tests/golden/"]

[tool.ty.rules]
# pyright still needs these `# type: ignore` comments
unused-type-ignore-comment = "ignore"

# ty findings still to fix: drop a rule (or block) once its file passes it
[[tool.ty.overrides]]
include = ["tested/dsl/ast_translator.py"]
rules = { deprecated = "ignore", invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/dsl/translate_parser.py"]
rules = { invalid-argument-type = "ignore", missing-argument = "ignore" }

[[tool.ty.overrides]]
include = ["tested/features.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/judge/core.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/bash/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/c/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/c/generators.py"]
rules = { unsupported-operator = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/cpp/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/cpp/generators.py"]
rules = { redundant-cast = "ignore", unsupported-operator = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/csharp/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/csharp/generators.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/generation.py"]
rules = { invalid-argument-type = "ignore", no-matching-overload = "ignore", unresolved-attribute = "ignore", unsupported-operator = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/haskell/config.py"]
rules = { invalid-argument-type = "ignore", invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/java/config.py"]
rules = { invalid-argument-type = "ignore", invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/java/generators.py"]
rules = { unsupported-operator = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/javascript/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/javascript/generators.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/kotlin/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/kotlin/generators.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/python/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/python/generators.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/typescript/config.py"]
rules = { invalid-return-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/languages/typescript/generators.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/oracles/ignored.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/oracles/nothing.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/oracles/value.py"]
rules = { invalid-assignment = "ignore" }

[[tool.ty.overrides]]
include = ["tested/parsing.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tested/serialisation.py"]
rules = { invalid-argument-type = "ignore", invalid-return-type = "ignore", no-matching-overload = "ignore", not-subscriptable = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_compilation.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_dsl_expression.py"]
rules = { invalid-argument-type = "ignore", invalid-assignment = "ignore", invalid-declaration = "ignore", not-subscriptable = "ignore", unresolved-attribute = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_dsl_yaml.py"]
rules = { invalid-argument-type = "ignore", unresolved-attribute = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_language_quirks.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_oracles_builtin.py"]
rules = { possibly-missing-submodule = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_parsing.py"]
rules = { invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["tests/test_serialisation.py"]
rules = { invalid-argument-type = "ignore" }

[tool.poetry]
name = "tested"
version = "1.0.0"
description = ""
authors = ["Niko Strijbol <strijbol.niko@gmail.com>"]
license = "MIT"
readme = "README.md"
