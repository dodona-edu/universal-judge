[tool.isort]
profile = "black"
skip_glob = ["tests/exercises/*", "tests/golden/*"]

[tool.black]
line-length = 88
extend-exclude="tests/(exercises|golden)/*"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "bash",
    "c",
    "cpp",
    "csharp",
    "haskell",
    "java",
    "javascript",
    "kotlin",
    "python",
    "runhaskell",
    "typescript",
]

[tool.pyright]
exclude = ["tests/exercises/", "tests/golden/", "tests/snapshots/", "tests/descriptions/"]

[tool.poetry]
name = "tested"
version = "1.0.0"
description = ""
authors = ["Niko Strijbol <strijbol.niko@gmail.com>"]
license = "MIT"
readme = "README.md"
