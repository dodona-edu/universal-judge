[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/exercises/", "tests/golden/", "tests/descriptions/"]

[tool.ruff.lint.per-file-ignores]
# These tests check that typing.Union is handled like X | Y
"tests/test_parsing.py" = ["UP007"]

[tool.pytest]
strict = true
testpaths = ["tests"]
markers = [
    "bash",
    "c",
    "cpp",
    "csharp",
    "haskell",
    "java",
    "javascript",
    "kotlin",
    "python",
    "typescript",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/exercises/", "tests/golden/"]

[tool.ty.rules]
unused-type-ignore-comment = "error"

[tool.poetry]
name = "tested"
version = "1.0.0"
description = ""
authors = ["Niko Strijbol <strijbol.niko@gmail.com>"]
license = "MIT"
readme = "README.md"
